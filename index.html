<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยิงอวกาศ</title>
<style>
:root{--bg:#070b1f;--fg:#e8ecff;--accent:#ffb020;--hot:#ff4d6d;--cool:#4cc9f0;--panel:#10173a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#070b1f;--fg:#e8ecff}}
:root:not([data-theme="light"]){--bg:#070b1f}
:root[data-theme="dark"]{--bg:#070b1f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Kanit","Noto Sans Thai",system-ui,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;box-sizing:border-box;border:2px solid #3a4a9a;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:18px;pointer-events:none;text-shadow:0 0 6px #000}
#hud b{color:var(--accent)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,11,31,.78);text-align:center;padding:20px}
#overlay h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.02em;color:var(--accent)}
#overlay p{margin:0;max-width:30em;line-height:1.6;color:#b9c3ee}
button{font:inherit;font-size:20px;padding:12px 34px;border:0;border-radius:10px;background:var(--accent);color:#1a1200;cursor:pointer}
button:focus-visible{outline:3px solid var(--cool);outline-offset:3px}
.hide{display:none!important}
#board{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:5;width:clamp(120px,15%,190px);padding:8px 10px;border-radius:10px;background:rgba(10,16,48,.55);border:1px solid rgba(120,140,255,.35);font-size:clamp(11px,1.5vw,14px);pointer-events:none;line-height:1.5}
#board h3{margin:0 0 4px;font-size:1.05em;color:var(--accent);text-align:center}
#board .r{display:flex;justify-content:space-between;gap:6px;color:#b9c3ee;padding:0 4px}
#board .r.me{color:#fff;background:rgba(255,176,32,.3);border-radius:4px}
#lvsel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(340px,80%)}
#lvsel button{font-size:18px;padding:8px 0;background:#1b2457;color:#e8ecff;border:2px solid #3a4a9a;border-radius:8px}
#lvsel button.on{background:var(--accent);color:#1a1200;border-color:var(--accent)}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="board"></div>
<div id="hud"><span>คะแนน <b id="sc">0</b></span><span>ด่าน <b id="lv">1</b></span><span id="li" style="font-size:22px;letter-spacing:2px"></span></div>
<div id="overlay">
<h1 id="ttl">ยิงอวกาศ</h1>
<p id="msg">บังคับยานด้วยปุ่ม W A S D เล็งด้วยเมาส์ ยานยิงไปทางเมาส์อัตโนมัติ กดทิศทาง WASD ค้างแล้วกด Space เพื่อพุ่ง (dash) ได้ทุก 0.5 วินาที (กด M เพื่อเปิด/ปิดเสียง) เก็บไอเทมเพื่ออัปเกรดปืน และเอาชีวิตรอดจากฝูงศัตรู</p>
<div style="color:#b9c3ee">เลือกด่านที่จะเริ่มเล่น</div>
<div id="lvsel"></div>
<button id="go">เริ่มเกม</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let state='menu',score,level,lives,player,bullets,enemies,ebullets,parts,items,stars,t,spawnT,shake,boss;
const keys={};let target=null;
let combo=0,comboT=0,banner=0,bannerTxt='',paused=false,best=0,board=[],selLevel=1,lvBase=0,lastT=0,buff={shield:0,speed:0,atk:0};
function renderBoard(me){
  let h='<h3>🏆 10 อันดับสูงสุด</h3>';
  for(let i=0;i<10;i++){const r=board[i];h+='<div class="r'+(r&&r===me?' me':'')+'"><span>'+(i+1)+'.</span><span>'+(r?r.score:'-')+'</span><span>'+(r?'ด่าน '+r.level:'')+'</span></div>'}
  $('board').innerHTML=h;
}
let wantDash=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(!e.repeat)wantDash=true}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function pt(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
// ---- เสียงเอฟเฟกต์ (WebAudio สร้างเสียงเอง ไม่ต้องใช้ไฟล์) ----
let aim={x:innerWidth/2,y:0};
addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();aim={x:e.clientX-r.left,y:e.clientY-r.top}});
let AC=null,muted=false;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='m')muted=!muted;if(k==='p'&&state==='play')paused=!paused});
function sfx(k){
  if(!AC||muted)return;
  const n=AC.currentTime;
  const tone=(type,f1,f2,d,v,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain(),s=n+delay;o.type=type;o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)};
  const noise=(d,v)=>{const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start(n)};
  if(k==='shoot')tone('square',900,200,.09,.035);
  else if(k==='hit')tone('triangle',300,120,.06,.05);
  else if(k==='boom'){noise(.25,.13);tone('sawtooth',160,40,.25,.07)}
  else if(k==='bigboom'){noise(.8,.25);tone('sawtooth',120,25,.8,.15)}
  else if(k==='hurt'){noise(.4,.2);tone('sawtooth',220,50,.4,.12)}
  else if(k==='item'){tone('sine',600,900,.1,.1);tone('sine',900,1400,.12,.1,.09)}
  else if(k==='boss'){tone('sawtooth',90,60,.9,.12);tone('sawtooth',95,55,.9,.12)}
  else if(k==='over'){tone('sawtooth',400,60,1.1,.14)}
  else if(k==='dash'){noise(.12,.08);tone('sine',300,900,.12,.06)}
  else if(k==='start'){tone('square',400,800,.12,.06);tone('square',600,1200,.15,.06,.1)}
}

stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),s:Math.random()*2+.5}));

function reset(){
  score=0;level=selLevel;lvBase=0;lives=5;t=0;combo=0;comboT=0;banner=100;bannerTxt='ด่าน '+level;paused=false;buff={shield:0,speed:0,atk:0};lastT=0;spawnT=0;shake=0;boss=null;
  player={x:W/2,y:H-90,w:34,h:40,cd:0,power:1,inv:90,dash:0,dnext:0,dx:0,dy:0};
  bullets=[];enemies=[];ebullets=[];parts=[];items=[];
  upd();
}
function upd(){$('sc').textContent=score;$('lv').textContent=level;$('li').innerHTML=Array.from({length:5},(_,i)=>'<span style="color:'+(i<lives?'#ff4d6d':'#3a2a45')+'">♥</span>').join('')}

function boom(x,y,c,n=18){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*4+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30+Math.random()*20,c})}}

function mv(){return 1+.2*(level-1)}
function mult(){return 1+Math.min(3,Math.floor(combo/5)*.5)}
function pickItem(){const r=Math.random();return r<.2?'l':r<.45?'p':r<.62?'s':r<.81?'v':'a'}
function buildSel(){const d=$('lvsel');d.innerHTML='';for(let i=1;i<=10;i++){const b=document.createElement('button');b.textContent=i;if(i===selLevel)b.className='on';b.onclick=()=>{selLevel=i;buildSel()};d.appendChild(b)}}
function fire(x,y,a,base,spd,r,step=.22){
  const n=Math.min(base+level-1,15),s=spd*(1+.2*(level-1));
  for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*step;ebullets.push({x,y,vx:Math.cos(aa)*s,vy:Math.sin(aa)*s,r})}
}
function spawn(){
  const k=Math.random();
  const x=40+Math.random()*(W-80);
  if(k<.55)enemies.push({type:0,x,y:-30,w:30,h:28,hp:1,vx:0,vy:1.6+level*.2,ph:Math.random()*6,pts:10});
  else if(k<.85)enemies.push({type:1,x,y:-30,w:32,h:30,hp:2,vx:0,vy:1.2+level*.15,ph:Math.random()*6,pts:25,cd:60+Math.random()*60});
  else enemies.push({type:2,x,y:-30,w:40,h:36,hp:4,vx:(Math.random()<.5?-1:1)*1.5,vy:1,ph:0,pts:50,cd:50});
}
function bossAtk(e,p){
  if(e.y<90)return;
  if(e.pat===undefined){e.pat=-1;e.pt=50;e.dur=0;e.last=-1;e.el=0}
  const rage=e.hp<e.max*.5,sp=1+.2*(level-1);
  if(rage&&!e.raged){e.raged=true;banner=90;bannerTxt='🔥 บอสโกรธ!';shake=12;sfx('boss')}
  const bs=(a,spd,r,x,y)=>{const s=(spd||3.5)*sp;ebullets.push({x:x===undefined?e.x:x,y:y===undefined?e.y+30:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:r||6})};
  const aim=Math.atan2(p.y-(e.y+30),p.x-e.x);
  if(e.pat<0){
    if(--e.pt>0)return;
    const pool=[0,1];if(level>=2)pool.push(2);if(level>=3)pool.push(3);if(level>=4)pool.push(5);if(level>=5)pool.push(4);
    const c=pool.filter(v=>v!==e.last);e.pat=c[Math.floor(Math.random()*c.length)];e.last=e.pat;
    e.dur=[90,120,45,70,30,30][e.pat];e.el=0;e.dir=Math.random()<.5?1:-1;
    return;
  }
  const el=e.el++;
  if(e.pat===0){if(el%28===0){const n=3+Math.floor(level/2)+(rage?2:0);for(let i=0;i<n;i++)bs(aim+(i-(n-1)/2)*.2,4)}}
  else if(e.pat===1){if(el%4===0){const arms=2+Math.floor(level/3)+(rage?1:0);for(let a=0;a<arms;a++)bs(el*.12*e.dir+a*6.283/arms,3)}}
  else if(e.pat===2){if(el%20===0){const n=12+level*2,o=Math.random()*6.28;for(let i=0;i<n;i++)bs(o+i*6.283/n,2.8)}}
  else if(e.pat===3){if(el%6===0&&el<60){bs(aim,4.5,5);if(rage){bs(aim+.25,4.5,5);bs(aim-.25,4.5,5)}}}
  else if(e.pat===4){if(el===0||(rage&&el===20)){const gap=Math.max(110,200-level*10),gx=60+Math.random()*Math.max(10,W-120-gap);for(let x=10;x<W;x+=15){if(x<gx||x>gx+gap)bs(Math.PI/2,2.6,6,x,e.y+40)}}}
  else if(e.pat===5){if(el===0){const n=Math.min(2+Math.floor(level/3),5);for(let i=0;i<n;i++)enemies.push({type:0,x:e.x+(i-(n-1)/2)*50,y:e.y+20,w:30,h:28,hp:1,vx:0,vy:2,ph:0,pts:10})}}
  if(el>=e.dur){e.pat=-1;e.pt=Math.round((rage?35:60)/(1+.1*(level-1)))}
}
function spawnBoss(){sfx('boss');banner=120;bannerTxt='⚠ บอสมาแล้ว!';
  boss={type:3,x:W/2,y:-80,w:110,h:70,hp:30+level*12,max:30+level*12,vx:2,vy:1,pts:500,cd:40,ph:0};
  enemies.push(boss);
}

function shoot(){
  const p=player,y=p.y-p.h/2;sfx('shoot');const a=Math.atan2(aim.y-p.y,aim.x-p.x);
  const add=(dx,vx)=>{const aa=a+vx/10,px=-Math.sin(a)*dx,py=Math.cos(a)*dx;bullets.push({x:p.x+px+Math.cos(a)*18,y:p.y+py+Math.sin(a)*18,vx:Math.cos(aa)*10,vy:Math.sin(aa)*10,a:aa})};
  if(p.power===1)add(0,0);
  else if(p.power===2){add(-9,0);add(9,0)}
  else if(p.power===3){add(0,0);add(-12,-1.5);add(12,1.5)}
  else{add(-8,0);add(8,0);add(-16,-2);add(16,2)}
}

function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}

function hurt(){
  if(player.inv>0||buff.shield>0)return;
  lives--;shake=14;combo=0;sfx('hurt');boom(player.x,player.y,'#4cc9f0',30);player.inv=120;player.power=Math.max(1,player.power-1);upd();
  if(lives<=0)end();
}
function end(){
  state='over';sfx('over');if(score>best)best=score;
  let me=null;if(score>0){me={score,level};board.push(me);board.sort((a,b)=>b.score-a.score);board=board.slice(0,10)}
  renderBoard(me);
  $('ttl').textContent='เกมจบ';
  $('msg').textContent='คะแนนของคุณ '+score+' — ถึงด่าน '+level+' — คะแนนสูงสุด '+best;
  $('go').textContent='เล่นอีกครั้ง';
  $('overlay').classList.remove('hide');
}

function update(){
  t++;
  const nowT=performance.now(),dt=Math.min(50,nowT-(lastT||nowT));lastT=nowT;for(const k in buff)if(buff[k]>0)buff[k]-=dt;
  const p=player,sp=6*(buff.speed>0?1.5:1);if(comboT>0)comboT--;else combo=0;if(banner>0)banner--;
  if(wantDash){
    wantDash=false;
    const dx=(keys['d']?1:0)-(keys['a']?1:0),dy=(keys['s']?1:0)-(keys['w']?1:0);
    if((dx||dy)&&performance.now()>=p.dnext){const l=Math.hypot(dx,dy);p.dx=dx/l;p.dy=dy/l;p.dash=8;p.inv=Math.max(p.inv,14);p.dnext=performance.now()+500;sfx('dash')}
  }
  if(p.dash>0){p.dash--;const qx=p.x,qy=p.y;p.x+=p.dx*20;p.y+=p.dy*20;boom(p.x,p.y,'#4cc9f0',3);
    const vx=p.x-qx,vy=p.y-qy,l=vx*vx+vy*vy;
    ebullets=ebullets.filter(b=>{let u=l?((b.x-qx)*vx+(b.y-qy)*vy)/l:0;u=Math.max(0,Math.min(1,u));
      if(Math.hypot(b.x-(qx+u*vx),b.y-(qy+u*vy))<30){boom(b.x,b.y,'#ff4d6d',6);return false}return true})}
  if(keys['a'])p.x-=sp;
  if(keys['d'])p.x+=sp;
  if(keys['w'])p.y-=sp;
  if(keys['s'])p.y+=sp;
  if(target){p.x+=(target.x-p.x)*.25;p.y+=(target.y-p.y)*.25}
  p.x=Math.max(20,Math.min(W-20,p.x));p.y=Math.max(60,Math.min(H-30,p.y));
  if(p.inv>0)p.inv--;
  p.cd--;
  if(p.cd<=0){shoot();p.cd=buff.atk>0?9:11}

  // spawn
  if(!boss){
    spawnT--;
    if(spawnT<=0){spawn();spawnT=Math.max(8,Math.round(60/(1+.3*(level-1))))}
    if(score-lvBase>=800&&!boss&&!enemies.some(e=>e.type===3)){spawnBoss()}
  }

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
  bullets=bullets.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);

  enemies.forEach(e=>{
    e.ph+=.05;
    if(e.type===0){if(e.y<30)e.y+=2;else{const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,s=1.3*mv();e.x+=dx/d*s;e.y+=dy/d*s}}
    else if(e.type===1){e.y+=.95*mv();e.x+=Math.sign(p.x-e.x)*Math.min(Math.abs(p.x-e.x),1.2*mv());e.cd--;if(e.cd<=0&&e.y>0){fire(e.x,e.y+14,1.5708,1,4,5);e.cd=90}}
    else if(e.type===2){e.x+=Math.sign(p.x-e.x)*Math.min(Math.abs(p.x-e.x),1.5*mv());const ty=Math.max(80,p.y-260);e.y+=Math.sign(ty-e.y)*Math.min(Math.abs(ty-e.y),mv());e.cd--;
      if(e.cd<=0){const a=Math.atan2(p.y-e.y,p.x-e.x);fire(e.x,e.y,a,1,3.5,5);e.cd=80}}
    else{
      if(e.y<90)e.y+=e.vy;else{e.x+=Math.sign(p.x-e.x)*Math.min(Math.abs(p.x-e.x),1.8*mv())}
      e.cd--;
      bossAtk(e,p);
    }
    if(e.type!==3&&e.y>H+40)e.dead=true;
  });

  // bullets vs enemies
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(b.dead||e.dead)return;
      if(hit({x:b.x,y:b.y,w:6,h:14},e)){
        b.dead=true;e.hp-=buff.atk>0?1.2:1;e.flash=4;sfx('hit');boom(b.x,b.y,'#ffb020',3);
        if(e.hp<=0){
          e.dead=true;combo++;comboT=150;score+=Math.round(e.pts*mult());sfx(e.type===3?'bigboom':'boom');boom(e.x,e.y,e.type===3?'#ff4d6d':'#ffb020',e.type===3?60:16);
          if(e.type===3){boss=null;level++;shake=20;lvBase=score;banner=150;bannerTxt='ด่าน '+level;items.push({x:e.x,y:e.y,type:'p',vy:2})}
          else if(Math.random()<.2)items.push({x:e.x,y:e.y,type:pickItem(),vy:2});
          upd();
        }
      }
    });
  });
  bullets=bullets.filter(b=>!b.dead);
  enemies.forEach(e=>{if(!e.dead&&hit({x:p.x,y:p.y,w:20,h:24},e)){if(e.type!==3)e.dead=true;boom(e.x,e.y,'#ffb020',10);hurt()}});
  enemies=enemies.filter(e=>!e.dead);

  ebullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(hit({x:b.x,y:b.y,w:b.r*2,h:b.r*2},{x:p.x,y:p.y,w:16,h:20})){b.dead=true;hurt()}});
  ebullets=ebullets.filter(b=>!b.dead&&b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);

  items.forEach(i=>{i.y+=i.vy;if(hit({x:i.x,y:i.y,w:22,h:22},{x:p.x,y:p.y,w:34,h:40})){
    i.dead=true;sfx('item');if(i.type==='p')p.power=Math.min(4,p.power+1);else if(i.type==='l')lives=Math.min(5,lives+1);else if(i.type==='s')buff.shield=5000;else if(i.type==='v')buff.speed=10000;else if(i.type==='a')buff.atk=10000;score+=20;upd()}});
  items=items.filter(i=>!i.dead&&i.y<H+20);

  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});
  parts=parts.filter(q=>q.l>0);
  if(shake>0)shake--;
  stars.forEach(s=>{s.y+=s.s*.004;if(s.y>1)s.y=0});
}

function drawShip(x,y,c,flip,rot){
  ctx.save();ctx.translate(x,y);ctx.shadowColor=c;ctx.shadowBlur=14;if(rot!==undefined)ctx.rotate(rot);if(flip)ctx.scale(1,-1);
  ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(16,18);ctx.lineTo(6,12);ctx.lineTo(0,18);ctx.lineTo(-6,12);ctx.lineTo(-16,18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-2,3,7,0,0,6.28);ctx.fill();
  ctx.restore();
}

function heart(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.6,y-s*.1,x-s*.8,y-s*1.2,x,y-s*.35);ctx.bezierCurveTo(x+s*.8,y-s*1.2,x+s*1.6,y-s*.1,x,y+s*.9);ctx.fill()}
function drawItem(i){
  const b=Math.sin(t/10+i.x)*2;
  if(i.type==='l'){heart(i.x,i.y+b,10,'#ff4d6d')}
  else if(i.type==='s'){ctx.fillStyle='rgba(111,227,255,.35)';ctx.strokeStyle='#6fe3ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(i.x,i.y+b,12,0,6.28);ctx.fill();ctx.stroke()}
  else if(i.type==='v'){ctx.fillStyle='#ffe066';ctx.beginPath();ctx.moveTo(i.x+3,i.y-13+b);ctx.lineTo(i.x-8,i.y+2+b);ctx.lineTo(i.x-1,i.y+2+b);ctx.lineTo(i.x-4,i.y+14+b);ctx.lineTo(i.x+8,i.y-3+b);ctx.lineTo(i.x+1,i.y-3+b);ctx.closePath();ctx.fill()}
  else if(i.type==='a'){ctx.fillStyle='#ff8a5c';ctx.fillRect(i.x-2,i.y-13+b,4,20);ctx.fillRect(i.x-8,i.y+3+b,16,4);ctx.beginPath();ctx.moveTo(i.x,i.y-17+b);ctx.lineTo(i.x+4,i.y-12+b);ctx.lineTo(i.x-4,i.y-12+b);ctx.fill()}
  else{ctx.fillStyle='#6ee7a0';ctx.beginPath();ctx.moveTo(i.x,i.y-13+b);ctx.lineTo(i.x+11,i.y+b);ctx.lineTo(i.x+4,i.y+b);ctx.lineTo(i.x+4,i.y+12+b);ctx.lineTo(i.x-4,i.y+12+b);ctx.lineTo(i.x-4,i.y+b);ctx.lineTo(i.x-11,i.y+b);ctx.closePath();ctx.fill()}
}
function drawBoss(e,c){
  const f=c==='#fff',pulse=Math.sin(t/8)*.5+.5;
  ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle=f?'#fff':'#5a189a';
  ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(-56,-34);ctx.lineTo(-54,8);ctx.lineTo(-30,30);ctx.lineTo(-18,18);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(18,-20);ctx.lineTo(56,-34);ctx.lineTo(54,8);ctx.lineTo(30,30);ctx.lineTo(18,18);ctx.closePath();ctx.fill();
  ctx.fillStyle=f?'#fff':'#9d4edd';
  ctx.beginPath();ctx.moveTo(-26,-26);ctx.lineTo(26,-26);ctx.lineTo(34,0);ctx.lineTo(14,38);ctx.lineTo(-14,38);ctx.lineTo(-34,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle=f?'#fff':'#3c096c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-26,-12);ctx.lineTo(26,-12);ctx.moveTo(-22,8);ctx.lineTo(22,8);ctx.stroke();
  ctx.fillStyle=f?'#fff':'#c77dff';ctx.fillRect(-50,0,8,30);ctx.fillRect(42,0,8,30);ctx.fillRect(-5,34,10,12);
  ctx.fillStyle='rgba(255,77,109,'+(.35+pulse*.4)+')';ctx.beginPath();ctx.arc(0,2,20,0,6.28);ctx.fill();
  ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(0,2,11,0,6.28);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,2,4,0,6.28);ctx.fill();
  ctx.fillStyle='#ffb020';[-22,22].forEach(dx=>{ctx.beginPath();ctx.moveTo(dx-6,-26);ctx.lineTo(dx,-36-Math.random()*8);ctx.lineTo(dx+6,-26);ctx.fill()});
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.fillStyle='#070b1f';ctx.fillRect(-20,-20,W+40,H+40);
  [[.25,.3,'120,60,200'],[.8,.75,'30,140,200']].forEach(([nx,ny,c])=>{const g=ctx.createRadialGradient(W*nx,H*ny,0,W*nx,H*ny,W*.45);g.addColorStop(0,'rgba('+c+',.22)');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)});
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${.3+s.s*.25})`;ctx.fillRect(s.x*W,s.y*H,s.s,s.s)});
  if(state==='menu'){ctx.restore();return}

  items.forEach(i=>{drawItem(i);
    });

  ctx.shadowColor='#ffe066';ctx.shadowBlur=10;ctx.fillStyle='#ffe066';bullets.forEach(b=>{ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a+Math.PI/2);ctx.fillRect(-2,-8,4,14);ctx.restore()});
  ctx.shadowColor='#ff4d6d';ctx.shadowBlur=10;ctx.fillStyle='#ff4d6d';ebullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill()});ctx.shadowBlur=0;

  enemies.forEach(e=>{
    const c=e.flash>0?'#fff':['#ff4d6d','#c77dff','#ff9e00','#9d4edd'][e.type];
    if(e.flash>0)e.flash--;
    if(e.type===3){
      drawBoss(e,c);
      
      ctx.fillStyle='#222';ctx.fillRect(e.x-55,e.y-62,110,6);ctx.fillStyle='#ff4d6d';ctx.fillRect(e.x-55,e.y-62,110*e.hp/e.max,6);
    }else drawShip(e.x,e.y,c,false,Math.atan2(player.y-e.y,player.x-e.x)+Math.PI/2);
  });

  const p=player;
  if(p.inv<=0||Math.floor(t/4)%2===0){
    const ang=Math.atan2(aim.y-p.y,aim.x-p.x);drawShip(p.x,p.y,'#4cc9f0',false,ang+Math.PI/2);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang+Math.PI/2);ctx.fillStyle='#ffb020';ctx.beginPath();ctx.moveTo(-5,14);ctx.lineTo(0,24+Math.random()*8);ctx.lineTo(5,14);ctx.fill();ctx.restore();
  }
  if(buff.shield>0&&(buff.shield>1500||Math.floor(t/5)%2===0)){ctx.strokeStyle='rgba(111,227,255,'+(.6+Math.sin(t/6)*.2)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,30,0,6.28);ctx.stroke();ctx.fillStyle='rgba(111,227,255,.12)';ctx.fill()}
  let by=56;[['shield','🛡','#6fe3ff'],['speed','⚡','#ffe066'],['atk','⚔','#ff8a5c']].forEach(([k,ic,c])=>{if(buff[k]>0){ctx.fillStyle=c;ctx.font='bold 16px sans-serif';ctx.textAlign='right';ctx.fillText(ic+' '+(buff[k]/1000).toFixed(1)+'s',W-14,by);by+=22}});
  const cdLeft=p.dnext-performance.now();
  if(cdLeft>0){ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(p.x-16,p.y+30,32,3);ctx.fillStyle='#4cc9f0';ctx.fillRect(p.x-16,p.y+30,32*(1-cdLeft/500),3)}
  parts.forEach(q=>{ctx.globalAlpha=q.l/50;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,3,3)});
  ctx.globalAlpha=1;ctx.textAlign='center';
  if(combo>1){ctx.fillStyle='#ffb020';ctx.font='bold 20px sans-serif';ctx.fillText('คอมโบ '+combo+'  x'+mult().toFixed(1),W/2,60)}
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='14px sans-serif';ctx.fillText('สูงสุด '+best+'  |  P หยุด  M เสียง',W/2,H-14);
  if(banner>0){ctx.globalAlpha=Math.min(1,banner/40);ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.fillText(bannerTxt,W/2,H*.35);ctx.globalAlpha=1}
  if(paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('หยุดชั่วคราว (กด P)',W/2,H/2)}
  ctx.restore();
}

function loop(){
  if(state==='play'&&!paused)update();
  draw();
  requestAnimationFrame(loop);
}
$('go').onclick=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();reset();sfx('start');state='play';$('overlay').classList.add('hide')};
reset();state='menu';renderBoard();buildSel();loop();
</script>
</body>
</html>
